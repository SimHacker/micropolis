<html>

  <head>

    <title>Micropolis Test</title>

	<link rel="stylesheet" type="text/css" href="jquery-pie/jquery-ui/themes/base/jquery.ui.all.css"/>
    <link rel="stylesheet" type="text/css" href="jquery-pie/css/jquery-pie.css"/>
	<link rel="stylesheet" type="text/css" href="css/micropolis.css"/>
    <link rel="stylesheet" type="text/css" href="css/mp.css"/>

    <script type="text/javascript" src="jquery-pie/jquery-ui/jquery-1.10.2.js"></script>
	<script type="text/javascript" src="jquery-pie/jquery-ui/ui/jquery.ui.core.js"></script>
	<script type="text/javascript" src="jquery-pie/jquery-ui/ui/jquery.ui.widget.js"></script>
	<script type="text/javascript" src="jquery-pie/jquery-ui/ui/jquery.ui.mouse.js"></script>
	<script type="text/javascript" src="jquery-pie/jquery-ui/ui/jquery.ui.slider.js"></script>
	<script type="text/javascript" src="jquery-pie/jquery-ui/ui/jquery.ui.button.js"></script>
	<script type="text/javascript" src="jquery-pie/jquery-ui/ui/jquery.ui.draggable.js"></script>
	<script type="text/javascript" src="jquery-pie/jquery-ui/ui/jquery.ui.resizable.js"></script>
	<script type="text/javascript" src="jquery-pie/jquery-ui/ui/jquery.ui.dialog.js"></script>
    <script type="text/javascript" src="jquery-pie/javascript/jquery-pie.js"></script>
    <script type="text/javascript" src="jquery-mousewheel/jquery.mousewheel.js"></script>
    <script type="text/javascript" src="seedrandom/seedrandom.js"></script>
    <script type="text/javascript" src="javascript/underscore.js"></script>
    <script type="text/javascript" src="javascript/backbone.js"></script>
    <script type="text/javascript" src="javascript/perlin-noise-classical.js"></script>
    <script type="text/javascript" src="javascript/perlin-noise-simplex.js"></script>
    <script type="text/javascript" src="javascript/app.js"></script>
    <script type="text/javascript" src="javascript/micropolis.js"></script>

    <script>
      $(function() {
          TestMicropolis();
      });
    </script>

  </head>

  <body>

    <div id="micropolis-wrapper">

      <div id="micropolis-tools">

        <h2>Zones</h2>

        <ul class="tools">
          <li data-urlname="bulldozer">
            <img src="images/icons/bulldozer.png">
          </li>
          <li data-urlname="commercialzone">
            <img src="images/icons/commercial.png">
          </li>
          <li data-urlname="residentialzone">
            <img src="images/icons/residential.png">
          </li>
          <li data-urlname="industrialzone">
            <img src="images/icons/industrial.png">
          </li>
          <li data-urlname="parkzone">
            <img src="images/icons/park.png">
          </li>
          <li data-urlname="road">
            <img src="images/icons/road.png">
          </li>
          <li data-urlname="powerline">
            <img src="images/icons/powerlines.png">
          </li>
        </ul>

      </div>

      <div id="micropolis-minimap-container">

        <h3>Minimap</h3>

        <canvas id="micropolis-minimap" width="128" height="128"></canvas>

      </div>

      <canvas id="micropolis-game" width="675" height="612"></canvas>

      <div id="micropolis-tool-overlay"></div>

      <audio preload="auto" id="micropolis-audio-plopok">
        <source src="sounds/PLOPOK.mp3" type="audio/mp3">
      </audio>

      <audio preload="auto" id="micropolis-audio-plopdoze">
        <source src="sounds/PLOPDOZE.mp3" type="audio/mp3">
      </audio>

    </div>

  </body>

</html>
