<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<!-- saved from url=(0030)http://ctho.org/games/simcity/ -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
    <title>SimCityinJavaScript</title>
    <script src="./SimCityinJavaScript_files/tree.js"></script>
    <script src="./SimCityinJavaScript_files/simcity.js"></script>
    <style>
      #theCanvas {
      width: 800px;
      height: 600px;
      border: 1px solid black;
      cursor: crosshair;
      }
      #theTable {
      width: 800px;
      }
      #menuTable {
      width: 200px;
      border: 1px solid black;
      }
      #menuTable>tbody>tr>td {
      border: 1px solid black;
      cursor: pointer;
      }
    </style>
  </head>
  <body onload="init()">
    <div>
      <table id="theTable">
	<tbody>
	  <tr>
	    <td>
	      <table id="infoTable" cellspacing="0">
		<tbody>
		  <tr>
		    <td><span id="month">January 1904</span></td>
		  </tr>
		  <tr>
		    <td>Funds: <span id="funds">10000</span></td>
		  </tr>
		</tbody>
	      </table>
	      <table id="menuTable" cellspacing="0">
		<tbody>
		  <tr>
		    <td colspan="2" style="text-align: center">Menu</td>
		  </tr>
		  <tr>
		    <td onclick="setMode(&#39;powerplant&#39;);"><img src="./SimCityinJavaScript_files/powerplantIcon.png" id="ppIcon"> Power Plant</td>
		    <td onclick="setMode(&#39;powerline&#39;);"><img src="./SimCityinJavaScript_files/powerlinesIcon.png" id="plIcon"> Power Lines</td>
		  </tr>
		  <tr>
		    <td onclick="setMode(&#39;residential&#39;);"><img src="./SimCityinJavaScript_files/residentialIcon.png" id="resIcon"> Residential</td>
		    <td onclick="setMode(&#39;commercial&#39;);"><img src="./SimCityinJavaScript_files/commercialIcon.png" id="comIcon"> Commercial</td>
		  </tr>
		  <tr>
		    <td onclick="setMode(&#39;industrial&#39;);"><img src="./SimCityinJavaScript_files/industrialIcon.png" id="indIcon"> Industrial</td>
		    <td onclick="setMode(&#39;road&#39;);"><img src="./SimCityinJavaScript_files/roadIcon.png"> Roads</td>
		  </tr>
		  <tr>
		    <td onclick="setMode(&#39;bulldozer&#39;);"><img src="./SimCityinJavaScript_files/bulldozerIcon.png" id="bdIcon"> Bulldozer</td>
		    <td></td>
		  </tr>
		  <tr>
		    <td onclick="setMode(&#39;center&#39;);"><img src="./SimCityinJavaScript_files/centerIcon.png" id="ctrIcon"> Center</td>
		    <td><img src="./SimCityinJavaScript_files/zoomInIcon.png" onclick="zoom(1.5)"> <img src="./SimCityinJavaScript_files/zoomOutIcon.png" onclick="zoom(1/1.5)"> Zoom</td>
		  </tr>
		</tbody>
	      </table>
	    </td>
	    <td>
	      <canvas id="theCanvas" width="800" height="600"></canvas>
	    </td>
	  </tr>
	</tbody>
      </table>
    </div>
    
    <p><a href="http://ctho.org/games/">Back to CTho's JavaScript Games</a></p>
<textarea id="dbgBox" rows="5" cols="40"></textarea>
  
</body></html>
